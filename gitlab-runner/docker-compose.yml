services:
  dind:
    image: docker:20-dind
    restart: always
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --storage-driver=overlay2

  runner:
    restart: always
    build: .
    depends_on:
      - dind
    environment:
      - DOCKER_HOST=tcp://dind:2375
