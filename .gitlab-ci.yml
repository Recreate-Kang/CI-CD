stages:
  - test
  - build
  - deploy

cache:
  key: global-cache
  paths:
    - frontend/node_modules/
    - backend/.gradle/caches/
    - backend/.gradle/wrapper/
    - backend/build/

# 1️⃣ FRONT:*, BACK:* 브랜치 → 빌드 & 단위 테스트 (캐싱 적용)
test-frontend:
  stage: test
  only:
    - /^.*-FRONT\/.*$/
    - dev  # dev 브랜치에서도 실행되도록 추가
  script:
    - echo "🛠️ Running Frontend Unit Tests"
    - cd frontend
    - npm ci  # `npm install` 대신 `npm ci` 사용 (더 빠름)
    - npm run test

test-backend:
  stage: test
  only:
    - /^.*-BACK\/.*$/
    - dev  # dev 브랜치에서도 실행되도록 추가
  services:
    - name: mysql:8.0
      alias: mysql
    - name: redis:7.4.0
      alias: redis
    - name: rabbitmq:3.12
      alias: rabbitmq
  script:
    - echo "🛠️ Running Backend Unit Tests"
    - cd backend
    - ./gradlew test --build-cache  # Gradle 빌드 캐시 활성화

# 2️⃣ dev 브랜치 → 빌드 & 단위 테스트 + 도커 빌드 + 배포 (캐싱 적용)
build-and-test-dev:
  stage: build
  only:
    - dev
  script:
    - echo "🛠️ Building and Testing for dev branch"
    - cd backend && ./gradlew build --build-cache
    - cd ../frontend && npm run build
    - echo "✅ All tests passed!"

docker-build-dev:
  stage: build
  only:
    - dev
  script:
    - echo "🐳 Building Docker images for dev with cache"
    - docker-compose -f docker-compose.yml build

deploy-dev:
  stage: deploy
  only:
    - dev
  script:
    - echo "🚀 Deploying to dev environment"
    - docker-compose -f docker-compose.override.yml up -d
    - echo "✅ dev deployment successful!"

# 3️⃣ MASTER 브랜치 → 도커 빌드 + 최종 배포 (캐싱 적용)
docker-build-master:
  stage: build
  only:
    - master
  script:
    - echo "🐳 Building Docker images for MASTER with cache"
    - docker-compose -f docker-compose.yml build

deploy-master:
  stage: deploy
  only:
    - master
  script:
    - echo "🚀 Deploying to Production!"
    - docker-compose -f docker-compose.prod.yml up -d
    - echo "✅ Production deployment successful!"
